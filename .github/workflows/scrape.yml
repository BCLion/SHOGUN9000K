name: SHOGUN9000K Daily Ingest

on:
  schedule:
    - cron: '0 */8 * * *'      # Every 8 hours
  workflow_dispatch:

jobs:
  scrape-and-revalidate:
    runs-on: ubuntu-latest
    env:
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Trigger Scrape
        env:
          LIVE_URL: ${{ secrets.VERCEL_LIVE_URL }}
          SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          echo "Hitting $LIVE_URL/api/scrape?secret=$SECRET"
          curl -f -X GET "$LIVE_URL/api/scrape?secret=$SECRET" || exit 1