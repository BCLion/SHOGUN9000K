# .github/workflows/scrape.yml
# SHOGUN9000K — DAILY DOMINATION PIPELINE (2025 CANONICAL EDITION)

name: SHOGUN9000K Daily Ingest

on:
  schedule:
    # Every 6 hours — maximum freshness without getting rate-limited
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Manual trigger button in GitHub UI

jobs:
  trigger-scrape:
    runs-on: ubuntu-latest
    name: Fire the Scraper

    steps:
      - name: Launch APC9000 Scraper
        env:
          # Your actual live Vercel URL (the one that shows in the dashboard)
          VERCEL_URL: ${{ secrets.VERCEL_LIVE_URL }}
          # Must be EXACTLY the same value you have in Vercel → Environment Variables
          REVALIDATE_SECRET: apc9000
        run: |
          echo "SHOGUN9000K WAKING UP..."
          echo "Target → $VERCEL_URL/api/scrape?secret=$REVALIDATE_SECRET"
          echo ""

          RESPONSE=$(curl -s -f -X GET \
            "$VERCEL_URL/api/scrape?secret=$REVALIDATE_SECRET" \
            -H "User-Agent: SHOGUN9000K-GitHub-Action/1.0")

          echo "RESPONSE FROM MATRIX:"
          echo "$RESPONSE" | jq .

          echo ""
          echo "DOMINATION COMPLETE. THE UNDERGROUND HAS BEEN FED."